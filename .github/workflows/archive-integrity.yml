name: Archive integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: archive-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for inline JavaScript syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run validator unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate archive and site structure
        run: python validate_archive.py
